name: Build & Publish APK to Release

on:
  push:
    tags:
      - 'v*'           # uruchamia się na: git tag v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build APK and publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write    # wymagane do tworzenia GitHub Release

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'microsoft'

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --skip-sign-check

    - name: Install Android SDK platform 36
      run: |
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-36" \
          "build-tools;36.0.0"

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-

    - name: Restore
      run: |
        cd MyMauiApp/
        dotnet restore

    # ── Determine version ─────────────────────────────────────────────────────
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    # ── Build ─────────────────────────────────────────────────────────────────

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > myapp.keystore
    
    
    
    - name: Build Release APK
      run: |
        cd MyMauiApp/
        dotnet publish \
          -f net10.0-android \
          -c Release \
          -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT \
          -p:AcceptAndroidSDKLicenses=true \
          -p:AndroidPackageFormats=apk \
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.tag }} \
          -p:AndroidKeyStore=true \
          -p:AndroidSigningKeyStore=${{ github.workspace }}/myapp.keystore \
          -p:AndroidSigningKeyAlias=myapp \
          -p:AndroidSigningKeyPass=${{ secrets.KEYSTORE_PASSWORD }} \
          -p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }}          

    # ── Rename APK with version ───────────────────────────────────────────────
    - name: Rename APK
      run: |
        APK=$(find . -path "*/publish/*.apk" | head -1)
        echo "APK_PATH=$APK" >> $GITHUB_ENV
        
        APPNAME=$(basename $APK .apk)
        NEW_NAME="${APPNAME}-${{ steps.version.outputs.tag }}.apk"
        mv "$APK" "$(dirname $APK)/$NEW_NAME"
        echo "APK_FINAL=$(dirname $APK)/$NEW_NAME" >> $GITHUB_ENV

    # ── Create public GitHub Release with APK attached ────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "Release ${{ steps.version.outputs.tag }}"
        body: |
          ## 📱 Android APK

          Pobierz i zainstaluj plik `.apk` poniżej.

          ### Instalacja
          1. Pobierz plik `.apk`
          2. Na telefonie: **Ustawienia → Zabezpieczenia → Zezwól na nieznane źródła**
          3. Otwórz pobrany plik i zainstaluj

          ### Zmiany
          ${{ github.event.head_commit.message }}
        files: ${{ env.APK_FINAL }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
